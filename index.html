<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Claims Tracker</title>
<meta name="description" content="Big AI claims, and whether they held up. Every verdict links to its evidence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the Fast, With AI index, recast as a ledger of verdicts. Thin masthead, a tally bar that doubles as the filter, ruled grid of claims. */
:root{
  --bg:#f4f3ef; --paper:#fafaf7; --fg:#111; --muted:#6a6964; --rule:#d6d4cd; --line:#111;
  --pill:#111; --pill-fg:#f4f3ef; --on:#fff;
  --ok:#1d7a46; --part:#a86a00; --unv:#6b6f76; --disp:#c4500f; --back:#b3261e; --false:#7a1020;
  --display:"Raleway","Century Gothic","Avenir Next",sans-serif;
  --body:"Raleway","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111; --paper:#161616; --fg:#f0efea; --muted:#9a9993; --rule:#2c2b29; --line:#f0efea;
  --pill:#f0efea; --pill-fg:#111; --on:#111;
  --ok:#5cc98a; --part:#e7b04a; --unv:#a4a9b1; --disp:#f08a4b; --back:#ff7a6e; --false:#ff8fa0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111; --paper:#161616; --fg:#f0efea; --muted:#9a9993; --rule:#2c2b29; --line:#f0efea;
  --pill:#f0efea; --pill-fg:#111; --on:#111;
  --ok:#5cc98a; --part:#e7b04a; --unv:#a4a9b1; --disp:#f08a4b; --back:#ff7a6e; --false:#ff8fa0; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}

.top{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
h1{font-family:var(--display);font-weight:200;letter-spacing:-.04em;font-size:clamp(3.2rem,11.5vw,10rem);line-height:.95;margin:24px 0 16px;text-wrap:balance}
.dek{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;margin-bottom:28px;font-size:15px}
.dek p{margin:0}
.suggest{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.suggest:hover{background:var(--pill);color:var(--pill-fg)}

/* Tally: one segment per status, sized by count; each segment is also a filter button. */
.tally{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-bottom:12px;background:var(--rule)}
.tally span{display:block;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding-block:12px;border-top:2px solid var(--line)}
.bar button{font:600 12px var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.bar button .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--fg))}
.bar button .n{font-family:var(--mono);font-weight:400;color:var(--muted)}
.bar button[aria-pressed="true"]{background:var(--pill);color:var(--pill-fg)}
.bar button[aria-pressed="true"] .n{color:inherit;opacity:.7}
.bar button:focus-visible,.card summary:focus-visible,.suggest:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--rule)}
.card{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--paper)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.card .date{font-family:var(--mono);color:var(--muted)}
.status{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on);background:var(--c);border-radius:999px;padding:2px 10px;white-space:nowrap}
.art{aspect-ratio:1200/630;width:100%;overflow:hidden;background:var(--rule);position:relative}
.art img{width:100%;height:100%;display:block;object-fit:cover}
.art img.contain{object-fit:contain;background:#fff}
.art .ph{position:absolute;inset:0;display:grid;place-items:center;font:200 15px var(--display);color:var(--muted);padding:16px;text-align:center}
.claim{font-family:var(--display);font-weight:300;font-size:21px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
.claim::before{content:"“"}
.claim::after{content:"”"}
.who{font-size:12.5px;color:var(--muted);margin-top:-6px}
.verdict{margin:0;padding-left:10px;border-left:3px solid var(--c);font-size:14.5px;font-weight:500}
.card details{margin-top:auto;border-top:1px solid var(--rule);padding-top:10px}
.card summary{cursor:pointer;list-style:none;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.card summary::-webkit-details-marker{display:none}
.card summary::after{content:"+";font-family:var(--mono);font-size:14px;line-height:1}
.card details[open] summary::after{content:"–"}
.more{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin-top:10px;font-size:13.5px}
.more .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:2px}
.more a{text-underline-offset:2px}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;margin-top:32px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.legend b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.fine{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-top:16px;margin-top:24px;border-top:2px solid var(--line)}

@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion: no-preference){.card{transition:background .15s}.card:hover{background:var(--bg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span>AI Claims Tracker</span>
    <a href="https://woletee.github.io/fast-with-ai/">Sister site: Fast, With AI ↗</a>
  </header>

  <h1>Did it hold up?</h1>
  <div class="dek">
    <p>Big AI claims, checked against the evidence.</p>
    <a class="suggest" href="https://github.com/woletee/ai-claims-tracker/issues/new?template=new-claim.yml" target="_blank" rel="noopener">+ Submit a claim</a>
  </div>

  <div class="tally" id="tally" aria-hidden="true"></div>
  <div class="bar" id="bar" role="group" aria-label="Filter by verdict"></div>
  <div class="grid" id="grid"></div>

  <div class="legend" id="legend"></div>
  <footer class="fine">
    <span>Every verdict links to its evidence. Checked 22 Nov 2026.</span>
    <span>Images: each source's own, credited per card.</span>
  </footer>
</div>

<script>
const STATUS={
  "confirmed":{label:"Confirmed",c:"--ok",def:"Independent evidence supports it."},
  "partly":{label:"Partly true",c:"--part",def:"True in part, or overstated."},
  "unverified":{label:"Unverified",c:"--unv",def:"Only the claimant's own numbers so far."},
  "disputed":{label:"Disputed",c:"--disp",def:"Credible experts challenge it."},
  "walked-back":{label:"Walked back",c:"--back",def:"The claimant retracted or corrected it."},
  "false":{label:"False",c:"--false",def:"Evidence shows it wasn't true."}
};
const ORDER=Object.keys(STATUS);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=d=>{const [y,m]=d.split("-");return `${MON[+m-1]} ${y}`;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cv=s=>`var(${STATUS[s]?.c||"--unv"})`;
let C=[], current="all";
const grid=document.getElementById("grid"), bar=document.getElementById("bar");

function card(x){
  const st=STATUS[x.status]||STATUS.unverified;
  const img=x.image?`<img src="${esc(x.image)}" alt="" class="${x.imageFit==="contain"?"contain":""}" loading="lazy" onerror="this.remove()">`:"";
  return `<article class="card" style="--c:${cv(x.status)}">
    <div class="row"><span class="date">${fmt(x.date)}</span><span class="status">${st.label}</span></div>
    <div class="art"><div class="ph">${esc(x.who)}</div>${img}</div>
    <h2 class="claim">${esc(x.claim)}</h2>
    <div class="who">${esc(x.who)}</div>
    <p class="verdict">${esc(x.verdict)}</p>
    <details><summary><span>Evidence</span></summary>
      <div class="more">
        <span class="k">Found</span><span>${esc(x.detail)}</span>
        <span class="k">Sources</span><span>${(x.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(" · ")}</span>
        ${x.image?`<span class="k">Image</span><span><a href="${esc(x.imagePage)}" target="_blank" rel="noopener">${esc(x.imageCredit)}</a></span>`:""}
      </div></details>
  </article>`;
}
function render(){
  const rows=C.filter(x=>current==="all"||x.status===current).sort((a,b)=>b.date.localeCompare(a.date));
  grid.innerHTML=rows.map(card).join("");
  bar.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===current?"true":"false"));
}
function setup(){
  const count=s=>C.filter(x=>x.status===s).length;
  document.getElementById("tally").innerHTML=ORDER.filter(count).map(s=>`<span style="flex:${count(s)};background:${cv(s)}" title="${STATUS[s].label}: ${count(s)}"></span>`).join("");
  bar.innerHTML=`<button id="f-all" data-s="all" aria-pressed="true">All <span class="n">${C.length}</span></button>`+
    ORDER.filter(count).map(s=>`<button id="f-${s}" data-s="${s}" style="--c:${cv(s)}" aria-pressed="false"><span class="dot"></span>${STATUS[s].label} <span class="n">${count(s)}</span></button>`).join("");
  bar.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{current=b.dataset.s;render();}));
  document.getElementById("legend").innerHTML=ORDER.map(s=>`<div style="--c:${cv(s)}"><b>${STATUS[s].label}</b><br>${STATUS[s].def}</div>`).join("");
  render();
}
fetch("data/claims.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{C=d;setup();})
  .catch(()=>{grid.innerHTML='<p style="padding:16px">Could not load the claims. Refresh to try again.</p>';});
</script>
</body>
</html>

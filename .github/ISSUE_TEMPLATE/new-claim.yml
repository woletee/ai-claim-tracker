name: Submit an entry
description: Add a notable AI discovery or creation with its sources. Takes about 3 minutes.
title: "[Entry] "
labels: ["new-claim", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting an AI discovery or creation. Keep answers short.
        A maintainer reviews the sources before anything goes live.
  - type: input
    id: claim
    attributes:
      label: What was built or discovered
      description: Short headline, in a few words.
      placeholder: Bun was rewritten from Zig to Rust in 11 days
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who made it
      placeholder: Jarred Sumner (Bun)
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: When (year and month)
      description: Format YYYY-MM
      placeholder: 2026-07
    validations:
      required: true
  - type: input
    id: claim_url
    attributes:
      label: Link to the announcement or post
      description: Where it was announced or shared.
    validations:
      required: true
  - type: input
    id: verdict
    attributes:
      label: Short summary
      description: One sentence.
      placeholder: It shipped as Bun 1.4 and passed the full test suite.
    validations:
      required: true
  - type: input
    id: evidence_url
    attributes:
      label: Source link
      description: An independent source, repo, or paper.
    validations:
      required: true
  - type: input
    id: evidence2_url
    attributes:
      label: Second source link (optional)
